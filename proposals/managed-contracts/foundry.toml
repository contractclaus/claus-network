[profile.default]
src = "."
test = "."
out = "out"
cache_path = "cache"
solc_version = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
fs_permissions = []
auto_detect_remappings = false
allow_paths = ["../../contracts/lib"]
remappings = ["@openzeppelin/contracts/=../../contracts/lib/openzeppelin-contracts/contracts/", "forge-std/=../../contracts/lib/forge-std/src/"]
